<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101122"><title>Word Dash: Letter Salvage</title>
  <link rel="stylesheet" href="./styles.css?v=3"><link rel="stylesheet" href="/games/_shared/game-tab.css?v=1">
</head>
<body>
<main class="cockpit">
  <header><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>Word Dash <b>/</b> Letter Salvage</span></div><div class="toolbar"><button id="sound" aria-pressed="false">Sound off</button><button id="pause" disabled>Pause</button></div></header>
  <section class="scope" aria-label="Orbital salvage flight deck">
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="readings"><span id="sector"></span><span>Score <b id="score">0</b></span><span>Shield <b id="shield">3/3</b></span></div>
    <div id="contacts" aria-label="Incoming targets"></div>
    <div id="barrier" aria-hidden="true"></div>
    <div id="panel" class="overlay">
      <div class="sheet"><span class="kicker" id="eyebrow">WORD DASH</span><h1 id="title">Letter<br><em>Salvage</em></h1><p id="brief"></p>
      <div class="commands"><button id="btnStart" class="launch">Launch flight</button><button id="info">How to play</button></div>
      <small id="record"></small></div>
    </div>
  </section>
  <section class="console" aria-label="Flight controls">
    <div class="strip"><div><small>Salvaged</small><b id="quota">0 / 6</b></div><p id="signal" role="status">Ready for launch.</p></div>
    <div id="keys" aria-label="On-screen keyboard"></div>
  </section>
</main>
<script src="./vocabulary.js"></script><script src="./flight-art.js?v=3"></script><script src="./game.js?v=3"></script><script type="module" src="/games/_shared/game-tab.mjs?v=1"></script>
</body></html>
