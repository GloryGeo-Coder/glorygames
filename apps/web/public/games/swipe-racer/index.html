<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b31">
<meta name="description" content="Race Kai through Harbour Duel or chase Mara up Frostline Pass. Steer through gold gates, coast across ice to earn Boost, and beat your best time on each course.">
<title>Swipe Racer: Harbour Duel &amp; Frostline Pass</title>
<link rel="stylesheet" href="./styles.css?v=3">
<link rel="stylesheet" href="/games/_shared/game-tab.css?v=1">
</head>
<body>
<main aria-label="Swipe Racer">
<canvas aria-label="Race course. Use left and right to change lanes and Space to boost."></canvas>
<div class="hud" hidden><div class="metric"><span>Race position</span><strong id="position"></strong></div><div class="metric"><span id="sector"></span><strong id="clock"></strong></div><button id="pause" aria-label="Pause race">Ⅱ</button></div>
<div class="strip" hidden><i></i></div><div class="flash" role="status"></div>
<div class="controls" hidden><button id="left" aria-label="Steer left">◀</button><button id="right" aria-label="Steer right">▶</button><button id="boost" class="primary"></button></div>
<div class="overlay"><section><div class="kicker" id="eyebrow"></div><h1 id="title"></h1><p id="copy"></p><p id="hint" class="muted"></p><p id="raceScore" hidden></p><button class="primary" id="btnStart"></button><button id="other"></button><button id="restart" hidden>Restart race</button></section></div>
</main>
<script src="./game.js?v=3"></script>
<script type="module" src="/games/_shared/game-tab.mjs?v=1"></script>
</body>
</html>
