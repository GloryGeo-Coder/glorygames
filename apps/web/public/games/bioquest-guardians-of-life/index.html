<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102c2a">
  <title>BioQuest: Guardians of Life</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="missions.js"></script>
  <script defer src="grade5.js"></script>
  <script defer src="grade6.js"></script>
  <script defer src="grade7.js"></script>
  <script defer src="grade8.js"></script>
  <script defer src="grade9.js"></script>
  <script defer src="grade10.js"></script>
  <link rel="stylesheet" href="expedition.css">
  <script defer src="fieldwork.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/play/bioquest-guardians-of-life" aria-label="BioQuest game page"><img class="brand-portrait" src="assets/portraits/pip.webp" alt=""><span>BIOQUEST <small>GUARDIANS OF LIFE</small></span></a>
      <div class="top-actions"><button id="sound" class="icon-btn" type="button" aria-label="Turn sound on">♪ <span>Sound off</span></button><button id="fullscreen" class="icon-btn" type="button" aria-label="Enter fullscreen" hidden> <span>Fullscreen</span></button></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer>Selected Grades 4–10 · Natural Sciences & Life Sciences</footer>
  </div>
  <template id="home-template">
    <section class="hero">
      <div class="hero-art" id="hero-scene" role="img" aria-label="BioQuest: Guardians of Life. Nala and Pip at the research centre."></div>
      <div class="hero-content"><p class="eyebrow" id="grade-dispatch">Research centre</p><h1 id="dispatch-title">Field expedition</h1><p id="dispatch-brief"></p><div class="hero-buttons"><button class="primary" id="continue">Start exploring <span>→</span></button></div></div>
    </section>
    <section class="map-section"><div class="grade-picker" role="group" aria-label="Choose a grade"><span>CHOOSE YOUR LEARNING PATH</span><button id="grade4" class="grade-button" type="button">Grade 4</button><button id="grade5" class="grade-button" type="button">Grade 5</button><button id="grade6" class="grade-button" type="button">Grade 6</button><button id="grade7" class="grade-button" type="button">Grade 7</button><button id="grade8" class="grade-button" type="button">Grade 8</button><button id="grade9" class="grade-button" type="button">Grade 9</button><button id="grade10" class="grade-button" type="button">Grade 10</button></div><div class="section-head"><div><p class="eyebrow">YOUR FIELD JOURNAL</p><h2 id="grade-title">Grade 4: Life begins here</h2><p>Complete each investigation to open the next location.</p></div><div class="progress-pill" id="progress"></div></div><div id="missions" class="mission-grid"></div></section>
    <section class="kit-panel"><div class="section-head"><div><p class="eyebrow">Pip’s field kit</p><h2>Lens studies</h2><p>Look closer at a specimen and record what you find.</p></div></div><div id="kit-studies" class="kit-grid"></div></section>
    <details class="notes-panel"><summary id="notes-count">Collected field notes</summary><ul id="field-notes"></ul></details>
  </template>
</body>
</html>
