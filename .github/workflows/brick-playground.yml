name: Brick Playground workshop and worlds
on:
  pull_request:
    paths:
      - 'apps/web/public/games/brick-playground-3d/**'
      - 'apps/web/public/play/brick-playground-3d.html'
      - 'apps/web/scripts/brick-playground*'
      - 'apps/web/scripts/brick-vehicle*'
      - 'apps/web/scripts/brick-canal*'
      - 'apps/web/scripts/brick-district*'
      - 'apps/web/scripts/brick-freight*'
      - 'apps/web/scripts/brick-blueprint*'
      - 'apps/web/scripts/brick-upstairs*'
      - 'apps/web/scripts/brick-settlement*'
      - 'apps/web/scripts/brick-builder*'
      - 'apps/web/scripts/brick-resident*'
      - 'apps/web/scripts/brick-transport*'
      - 'apps/web/scripts/game-routing-http.mjs'
      - 'apps/web/scripts/audit-seo.mjs'
      - 'apps/web/src/lib/gamePaths.ts'
      - 'apps/web/src/app/categories/**'
      - 'apps/web/src/app/play/**'
      - 'apps/web/src/app/games/**'
      - 'apps/web/src/app/sitemap.ts'
      - 'apps/web/src/app/robots.ts'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/open-next.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/public/_headers'
      - 'apps/web/wrangler.jsonc'
      - '.github/workflows/brick-playground.yml'
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: post
            suites: resident-park settlement-post
          - group: move-ins
            suites: resident-keeper resident-move-in resident-market settlement-lighting settlement-trail
          - group: construction
            suites: playground vehicle canal blueprint builder
          - group: neighbourhoods
            suites: district freight upstairs settlement-neighbourhoods settlement-garden
          - group: streets
            suites: settlement-street-builder settlement-street-names
          - group: settlements
            suites: settlement transport
          - group: residents
            suites: resident
          - group: directions
            suites: settlement-directions transport-rounds transport-stock
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/brick_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --test apps/web/scripts/brick-playground.test.mjs apps/web/scripts/brick-vehicle.test.mjs apps/web/scripts/brick-canal.test.mjs apps/web/scripts/brick-district.test.mjs apps/web/scripts/brick-freight.test.mjs apps/web/scripts/brick-blueprint.test.mjs apps/web/scripts/brick-upstairs.test.mjs apps/web/scripts/brick-settlement.test.mjs apps/web/scripts/brick-resident.test.mjs apps/web/scripts/brick-transport.test.mjs apps/web/scripts/brick-transport-stock.test.mjs apps/web/scripts/brick-resident-keeper.test.mjs
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix apps/web
      - name: Prepare Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/brick-browser" --no-save --package-lock=false --ignore-scripts playwright@1.64.0
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/brick-browser/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/brick-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test production games on phone and desktop
        working-directory: apps/web
        env:
          BROWSER_SUITES: ${{ matrix.suites }}
          BRICK_SCREENSHOTS: ${{ runner.temp }}/brick-screenshots
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/brick-next.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:3000/play/brick-playground-3d -o /dev/null
          for suite in $BROWSER_SUITES; do
            node "scripts/brick-$suite-browser.cjs"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brick-${{ matrix.group }}-on-phone-and-desktop
          path: ${{ runner.temp }}/brick-screenshots
          if-no-files-found: warn

  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/brick_ci
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: /tmp/brick-routing-wrangler.log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - name: Package the Cloudflare Worker without deploying
        working-directory: apps/web
        run: node_modules/.bin/opennextjs-cloudflare build
      - name: Verify local Worker routes and asset headers
        working-directory: apps/web
        env:
          GAME_ORIGIN: http://127.0.0.1:8787
          TEST_WORKER: '1'
        run: |
          node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8787 --persist-to /tmp/brick-routing-state --var DATABASE_URL:postgresql://test:test@127.0.0.1:5432/brick_ci > /tmp/brick-routing-worker.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 60 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:8787/robots.txt -o /dev/null
          node --import tsx scripts/game-routing-http.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brick-worker-routing-logs
          path: /tmp/brick-routing-*.log
          if-no-files-found: warn
