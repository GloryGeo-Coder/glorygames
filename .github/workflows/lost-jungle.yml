name: Lost Jungle
on:
  pull_request:
    paths:
      - 'apps/web/public/games/lost-jungle-3d-temple-of-the-sun/**'
      - 'apps/web/scripts/lost-jungle*'
      - 'apps/web/scripts/helpers/jungle-*.cjs'
      - 'apps/web/scripts/helpers/kasi-png.cjs'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'tools/build-jungle-animation-data.py'
      - 'tools/build-jungle-soundtrack.py'
      - '.github/workflows/lost-jungle.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/lost-jungle-3d-temple-of-the-sun/**'
      - 'apps/web/scripts/lost-jungle*'
      - 'apps/web/scripts/helpers/jungle-*.cjs'
      - 'apps/web/scripts/helpers/kasi-png.cjs'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'tools/build-jungle-animation-data.py'
      - 'tools/build-jungle-soundtrack.py'
      - '.github/workflows/lost-jungle.yml'
permissions:
  contents: read
jobs:
  lost-jungle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/game.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-campaign.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-animation.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-animation-data.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-audio.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-music.js
      - run: node --test apps/web/scripts/lost-jungle*.test.cjs
  boss-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --check apps/web/scripts/lost-jungle-boss-browser.cjs
      - run: npm install --prefix "$RUNNER_TEMP/jungle-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Mobile and desktop boss encounters
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/jungle-browser/node_modules/playwright
          CHROME_BIN: /usr/bin/google-chrome
          JUNGLE_SCREENSHOTS: ${{ runner.temp }}/jungle-boss-screenshots
        run: node apps/web/scripts/lost-jungle-boss-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lost-jungle-boss-review
          path: ${{ runner.temp }}/jungle-boss-screenshots
          if-no-files-found: ignore
