name: Lost Jungle
on:
  pull_request:
    paths:
      - 'apps/web/public/games/lost-jungle-3d-temple-of-the-sun/**'
      - 'apps/web/scripts/lost-jungle*'
      - 'apps/web/scripts/helpers/jungle-*.cjs'
      - 'apps/web/scripts/helpers/kasi-png.cjs'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'tools/build-jungle-animation-data.py'
      - '.github/workflows/lost-jungle.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/lost-jungle-3d-temple-of-the-sun/**'
      - 'apps/web/scripts/lost-jungle*'
      - 'apps/web/scripts/helpers/jungle-*.cjs'
      - 'apps/web/scripts/helpers/kasi-png.cjs'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'tools/build-jungle-animation-data.py'
      - '.github/workflows/lost-jungle.yml'
permissions:
  contents: read
jobs:
  lost-jungle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/game.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-campaign.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-animation.js
      - run: node --check apps/web/public/games/lost-jungle-3d-temple-of-the-sun/jungle-animation-data.js
      - run: node --test apps/web/scripts/lost-jungle*.test.cjs
