name: Neon Orb
on:
  pull_request:
    paths:
      - 'apps/web/public/games/neon-orb-defender/**'
      - 'apps/web/scripts/neon-orb*'
      - 'apps/web/scripts/helpers/orb-*'
      - 'tools/build-orb-soundtrack.py'
      - '.github/workflows/neon-orb.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/neon-orb-defender/**'
      - 'apps/web/scripts/neon-orb*'
      - 'apps/web/scripts/helpers/orb-*'
      - 'tools/build-orb-soundtrack.py'
      - '.github/workflows/neon-orb.yml'
permissions:
  contents: read
jobs:
  neon-orb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: for file in apps/web/public/games/neon-orb-defender/*.js; do node --check "$file"; done
      - run: node --test apps/web/scripts/neon-orb*.test.cjs
