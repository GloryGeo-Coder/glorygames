name: Map Master
on:
  pull_request:
    paths:
      - 'apps/web/public/games/map-master-africa/**'
      - 'apps/web/scripts/map-master-*'
      - 'apps/web/scripts/helpers/map-master-*'
      - 'tools/build-map-master-atlas.py'
      - 'tools/build-map-master-provinces.py'
      - '.github/workflows/map-master.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/map-master-africa/**'
      - 'apps/web/scripts/map-master-*'
      - 'apps/web/scripts/helpers/map-master-*'
      - 'tools/build-map-master-atlas.py'
      - 'tools/build-map-master-provinces.py'
      - '.github/workflows/map-master.yml'
permissions:
  contents: read
jobs:
  map-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: for file in apps/web/public/games/map-master-africa/*.js; do node --check "$file"; done
      - run: node --test apps/web/scripts/map-master-*.test.cjs
