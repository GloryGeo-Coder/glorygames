name: Authentication error boundaries
on:
  pull_request:
    paths:
      - 'apps/web/src/app/api/auth/**'
      - 'tests/auth/**'
      - '.github/workflows/auth-error-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/app/api/auth/**'
      - 'tests/auth/**'
      - '.github/workflows/auth-error-boundary.yml'
permissions:
  contents: read
jobs:
  auth-error-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-vm-modules --test tests/auth/error-boundary.test.mjs
