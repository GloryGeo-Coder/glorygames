name: High Speed Racer 3D
on:
  pull_request:
    paths:
      - 'apps/web/public/games/high-spead-racer/**'
      - 'apps/web/scripts/high-speed-racer*'
      - 'apps/web/scripts/helpers/racer-runtime.cjs'
      - 'tools/build-high-speed-racer-assets.py'
      - '.github/workflows/high-speed-racer.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/high-spead-racer/**'
      - 'apps/web/scripts/high-speed-racer*'
      - 'apps/web/scripts/helpers/racer-runtime.cjs'
      - 'tools/build-high-speed-racer-assets.py'
      - '.github/workflows/high-speed-racer.yml'
permissions:
  contents: read
jobs:
  racer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --check apps/web/public/games/high-spead-racer/game.js
      - run: node --check apps/web/public/games/high-spead-racer/racer-3d.js
      - run: node --test apps/web/scripts/high-speed-racer-*.test.*
