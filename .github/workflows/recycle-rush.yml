name: Recycle Rush
on:
  pull_request:
    paths:
      - 'apps/web/public/games/recycle-rush/**'
      - 'apps/web/scripts/recycle-rush*'
      - 'apps/web/scripts/recycle-sprite-pack.cjs'
      - 'apps/web/scripts/recycle-arcade-pack.cjs'
      - 'apps/web/scripts/helpers/recycle-runtime.cjs'
      - '.github/workflows/recycle-rush.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/recycle-rush/**'
      - 'apps/web/scripts/recycle-rush*'
      - 'apps/web/scripts/recycle-sprite-pack.cjs'
      - 'apps/web/scripts/recycle-arcade-pack.cjs'
      - 'apps/web/scripts/helpers/recycle-runtime.cjs'
      - '.github/workflows/recycle-rush.yml'
permissions:
  contents: read
jobs:
  recycle-rush:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: for file in apps/web/public/games/recycle-rush/*.js; do node --check "$file"; done
      - run: node --test apps/web/scripts/recycle-rush.test.cjs
