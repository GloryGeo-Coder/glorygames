name: Physics Force Lab
on:
  pull_request:
    paths:
      - 'apps/web/public/games/physics-force-lab/**'
      - 'apps/web/scripts/physics-*'
      - '.github/workflows/physics-force-lab.yml'
      - 'tools/physics-character-art.cjs'
      - 'tools/build-physics-characters.cjs'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/physics-force-lab/**'
      - 'apps/web/scripts/physics-*'
      - '.github/workflows/physics-force-lab.yml'
      - 'tools/physics-character-art.cjs'
      - 'tools/build-physics-characters.cjs'
permissions:
  contents: read
jobs:
  physics-force-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: for file in apps/web/public/games/physics-force-lab/*.js; do node --check "$file"; done
      - run: node --check tools/physics-character-art.cjs && node --check tools/build-physics-characters.cjs
      - run: node --test apps/web/scripts/physics-*.test.cjs
  physics-browser:
    needs: physics-force-lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHYSICS_SMOKE: '1'
      DATABASE_URL: postgresql://physics:physics@127.0.0.1:5432/physics_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/physics-browser" --no-save --package-lock=false --ignore-scripts playwright@1.64.0
          printf 'PLAYWRIGHT_PATH=%s/physics-browser/node_modules/playwright\\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Chromium and system dependencies
        run: '"$RUNNER_TEMP/physics-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Revision on mobile, fullscreen and refresh
        run: node apps/web/scripts/physics-revision-browser.cjs
      - name: Both modes fullscreen and mobile regression
        run: node apps/web/scripts/physics-display-browser.cjs
      - name: Original levels and fullscreen experiments
        run: node apps/web/scripts/physics-legacy-browser.cjs
      - name: Adventure repairs and fallback regression
        run: node apps/web/scripts/physics-browser.cjs
      - name: Character animation regression
        run: node apps/web/scripts/physics-characters-browser.cjs
      - name: Next.js production build
        run: npm run build --prefix apps/web
