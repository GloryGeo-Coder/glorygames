name: Swipe Racer Metro campaign
on:
  pull_request:
    paths:
      - 'apps/web/public/games/swipe-racer/**'
      - 'apps/web/scripts/swipe-racer-campaign*'
      - '.github/workflows/swipe-racer-campaign.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/swipe-racer/**'
      - 'apps/web/scripts/swipe-racer-campaign*'
      - '.github/workflows/swipe-racer-campaign.yml'
permissions:
  contents: read
jobs:
  metro-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --check apps/web/public/games/swipe-racer/game.js && node --check apps/web/public/games/swipe-racer/campaign.js && node --check apps/web/scripts/swipe-racer-campaign-browser.cjs
      - run: node --test apps/web/scripts/swipe-racer-campaign.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/swipe-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Metro and original routes on phone, landscape and desktop
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/swipe-browser/node_modules/playwright
          CHROME_BIN: /usr/bin/google-chrome
          SWIPE_SCREENSHOTS: ${{ runner.temp }}/swipe-screenshots
        run: node apps/web/scripts/swipe-racer-campaign-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swipe-racer-metro-screenshots
          path: ${{ runner.temp }}/swipe-screenshots
          if-no-files-found: ignore
