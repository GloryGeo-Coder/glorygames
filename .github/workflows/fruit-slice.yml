name: Fruit Slice
on:
  pull_request:
    paths:
      - 'apps/web/public/games/fruit-slice/**'
      - 'apps/web/scripts/fruit-slice*'
      - 'apps/web/scripts/helpers/fruit-*.cjs'
      - 'apps/web/scripts/helpers/kasi-png.cjs'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'tools/build-fruit-*.py'
      - '.github/workflows/fruit-slice.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/fruit-slice/**'
      - 'apps/web/scripts/fruit-slice*'
      - 'apps/web/scripts/helpers/fruit-*.cjs'
      - 'apps/web/scripts/helpers/kasi-png.cjs'
      - 'apps/web/src/content/gameEditorials.ts'
      - 'tools/build-fruit-*.py'
      - '.github/workflows/fruit-slice.yml'
permissions:
  contents: read
jobs:
  fruit-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: for file in apps/web/public/games/fruit-slice/*.js; do node --check "$file"; done
      - run: node --test apps/web/scripts/fruit-slice*.test.cjs
