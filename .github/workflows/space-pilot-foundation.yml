name: Space Pilot chapter and mobile regression
on:
  pull_request:
    paths:
      - 'apps/web/public/games/space-pilot-platformer/**'
      - 'apps/web/scripts/space-pilot-*'
      - '.github/workflows/space-pilot-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/games/space-pilot-platformer/**'
      - 'apps/web/scripts/space-pilot-*'
      - '.github/workflows/space-pilot-foundation.yml'
permissions:
  contents: read
concurrency:
  group: pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  space-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --check apps/web/public/games/space-pilot-platformer/game.js
      - run: node --check apps/web/public/games/space-pilot-platformer/pilot-progress.js
      - run: node --check apps/web/public/games/space-pilot-platformer/asterion.js
      - run: node --check apps/web/public/games/space-pilot-platformer/asterion-art.js
      - run: node --check apps/web/public/games/space-pilot-platformer/asterion-audio.js
      - run: node --check apps/web/public/games/space-pilot-platformer/vulcanis.js
      - run: node --check apps/web/public/games/space-pilot-platformer/vulcanis-art.js
      - run: node --check apps/web/public/games/space-pilot-platformer/vulcanis-audio.js
      - run: node --check apps/web/public/games/space-pilot-platformer/luminara.js
      - run: node --check apps/web/public/games/space-pilot-platformer/luminara-art.js
      - run: node --check apps/web/public/games/space-pilot-platformer/luminara-audio.js
      - run: node --check apps/web/public/games/space-pilot-platformer/cryon.js
      - run: node --check apps/web/public/games/space-pilot-platformer/cryon-art.js
      - run: node --check apps/web/public/games/space-pilot-platformer/cryon-audio.js
      - run: node --check apps/web/public/games/space-pilot-platformer/verdantis.js
      - run: node --check apps/web/public/games/space-pilot-platformer/verdantis-art.js
      - run: node --check apps/web/public/games/space-pilot-platformer/verdantis-audio.js
      - run: node --check apps/web/public/games/space-pilot-platformer/novax.js
      - run: node --check apps/web/public/games/space-pilot-platformer/novax-art.js
      - run: node --check apps/web/public/games/space-pilot-platformer/novax-audio.js
      - run: node --test apps/web/scripts/space-pilot-foundation.test.cjs apps/web/scripts/space-pilot-asterion.test.cjs apps/web/scripts/space-pilot-vulcanis.test.cjs apps/web/scripts/space-pilot-luminara.test.cjs apps/web/scripts/space-pilot-cryon.test.cjs apps/web/scripts/space-pilot-verdantis.test.cjs apps/web/scripts/space-pilot-novax.test.cjs
  pilot-browser:
    needs: space-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://pilot:pilot@127.0.0.1:5432/pilot_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated browser tools
        timeout-minutes: 4
        run: |
          npm install --prefix "$RUNNER_TEMP/pilot-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=1 playwright@1.64.0
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/pilot-browser/node_modules/playwright" >> "$GITHUB_ENV"
          if browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; then
            echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            "$RUNNER_TEMP/pilot-browser/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          fi
      - name: Thirteen viewports, touch, saves and all eight boss fixtures
        run: node apps/web/scripts/space-pilot-foundation-browser.cjs
      - name: Asterion mission interactions and five physical routes
        run: node apps/web/scripts/space-pilot-asterion-browser.cjs
      - name: Vulcanis unlock, thirteen viewports, five routes and machinery
        run: PILOT_SCREENSHOTS="$RUNNER_TEMP/pilot-screenshots" node apps/web/scripts/space-pilot-vulcanis-browser.cjs
      - name: Upload Vulcanis review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulcanis-browser-screenshots
          path: ${{ runner.temp }}/pilot-screenshots
          if-no-files-found: ignore
      - name: Luminara beams, phase bridges, Guardian and mobile progression
        run: PILOT_SCREENSHOTS="$RUNNER_TEMP/luminara-screenshots" node apps/web/scripts/space-pilot-luminara-browser.cjs
      - name: Upload Luminara review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luminara-browser-screenshots
          path: ${{ runner.temp }}/luminara-screenshots
          if-no-files-found: ignore
      - name: Cryon traction, frost machinery, Mothership and mobile progression
        run: PILOT_SCREENSHOTS="$RUNNER_TEMP/cryon-screenshots" node apps/web/scripts/space-pilot-cryon-browser.cjs
      - name: Upload Cryon review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cryon-browser-screenshots
          path: ${{ runner.temp }}/cryon-screenshots
          if-no-files-found: ignore
      - name: Verdantis seeds, spores, Titan, five soundtracks and mobile progression
        run: PILOT_SCREENSHOTS="$RUNNER_TEMP/verdantis-screenshots" node apps/web/scripts/space-pilot-verdantis-browser.cjs
      - name: Upload Verdantis review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdantis-browser-screenshots
          path: ${{ runner.temp }}/verdantis-screenshots
          if-no-files-found: ignore
      - name: NOVA-X convoy, reactor fuses, Commander and escape progression
        run: PILOT_SCREENSHOTS="$RUNNER_TEMP/novax-screenshots" node apps/web/scripts/space-pilot-novax-browser.cjs
      - name: Upload NOVA-X review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novax-browser-screenshots
          path: ${{ runner.temp }}/novax-screenshots
          if-no-files-found: ignore
      - name: Next.js production build
        run: npm run build --prefix apps/web
      - name: Production entry and game-page launch
        run: node apps/web/scripts/space-pilot-built-browser.cjs

