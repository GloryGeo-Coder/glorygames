name: Guest launch boundaries
on:
  pull_request:
    paths: ['apps/web/src/**', 'apps/web/public/games/_shared/**', 'apps/web/scripts/**', 'tests/launch/**', 'tests/auth/**', 'ops/security/**', '.github/workflows/guest-launch.yml']
  push:
    branches: [main]
    paths: ['apps/web/src/**', 'apps/web/public/games/_shared/**', 'apps/web/scripts/**', 'tests/launch/**', 'tests/auth/**', 'ops/security/**', '.github/workflows/guest-launch.yml']
permissions:
  contents: read
jobs:
  guest-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
        working-directory: apps/web
      - run: node --experimental-vm-modules --test tests/launch/game-discovery.test.mjs tests/launch/analytics-consent.test.mjs tests/launch/guest-launch.test.mjs tests/launch/community-request.test.mjs tests/launch/community-active.test.mjs tests/launch/public-data-minimisation.test.mjs tests/launch/runtime-role.test.mjs tests/auth/error-boundary.test.mjs tests/auth/realtime-token-retirement.test.mjs apps/web/scripts/game-tab-score.test.mjs apps/web/scripts/recycle-rush.test.cjs
      - run: node node_modules/prisma/build/index.js generate
        working-directory: apps/web
      - run: node node_modules/next/dist/bin/next build --webpack
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
